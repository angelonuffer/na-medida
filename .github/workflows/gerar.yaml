name: Gerar

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar build
        run: npm run build

      - name: Anexar build
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: alvo
