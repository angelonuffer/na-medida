name: Testar

on:
  push:
  pull_request:

jobs:
  testar:
    runs-on: ubuntu-latest
    # Mesma imagem do devcontainer, para manter SO/fontes idênticos aos testes visuais locais.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Anexar resultados dos testes
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
