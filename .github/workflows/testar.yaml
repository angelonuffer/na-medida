name: Testar

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  gerar:
    uses: ./.github/workflows/gerar.yaml
    permissions:
      contents: read

  testar:
    needs: gerar
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Instalar dependências
        run: npm ci

      - name: Baixar build
        uses: actions/download-artifact@v8
        with:
          name: build
          path: alvo

      - name: Executar testes
        run: npm test

      - name: Anexar resultados dos testes
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
